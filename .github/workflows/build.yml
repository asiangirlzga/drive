name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The release APK is signed with the standard Android debug key so it installs
      # anywhere. Create that key if the runner does not have one yet.
      - name: Make debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: LiteDrivingSchool-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (tags like v1.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wifi-${{ github.run_number }}
          name: Wi-Fi build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
