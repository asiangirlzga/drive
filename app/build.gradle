plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lite.drivingschool'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lite.drivingschool'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Small + fast APK. Signed with the auto-generated debug key so it
            // installs on any TV / phone without you creating a keystore.
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
